name: Profitability VM private-canary compatibility

on:
  push:
    branches: [release/vm-profitability-canary-20261008]
  pull_request:
    paths:
      - web/app.py
      - web/private_shadow_v29.py
      - services/private_champion_shadow_v29.py
      - services/private_challenger_adapter_v31.py
      - services/frozen_candidate_worker_v31.py
      - research/all_236_champions_v26.json
      - tests/test_vm_profitability_canary.py
      - tests/test_vm_two_item_frozen_master.py
      - research/v21_canary_two_items_frozen.json
      - tests/test_v29_private_shadow.py
      - tests/test_v31_private_challenger.py
      - .github/workflows/vm-profitability-canary.yml

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -p "test_vm_profitability_canary.py" -v
      - run: python -m unittest discover -s tests -p "test_vm_two_item_frozen_master.py" -v
      - run: python -m unittest discover -s tests -p "test_v29_private_shadow.py" -v
      - run: python -m unittest discover -s tests -p "test_v31_private_challenger.py" -v
      - run: python -m py_compile web/app.py web/private_shadow_v29.py services/private_champion_shadow_v29.py services/private_challenger_adapter_v31.py services/frozen_candidate_worker_v31.py
