name: V39 routine audit CPU isolation

on:
  push:
    branches: [release/v37-scalability-audit-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-routine-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal project API prerequisite
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify transactionally durable audit queue and collector CPU split
        run: python -m unittest discover -s tests -p 'test_v39_durable_routine_audits.py' -v
      - name: Preserve collector SQLite deterministic close
        run: python -m unittest discover -s tests -p 'test_v37_sqlite_fd_hotfix.py' -v
      - name: Preserve V37 recovery queue/heartbeat and grouping
        run: |
          python -m unittest discover -s tests -p 'test_v38_gap_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v38_heartbeat_fastpath.py' -v
          python -m unittest discover -s tests -p 'test_v38_gap_invalidation_grouping.py' -v
      - name: Compile core collector and worker
        run: |
          python -m py_compile poller.py services/history_service.py services/durable_audit_queue_v39.py research/v38_gap_recovery.py
