name: Template pattern and earlier-window safeguards
on:
  push:
    branches: [research/v38-full-roster-live-prep-20261009]
    paths: ['research/template_window_study.py', 'tests/test_template_window_study.py', '.github/workflows/template-window.yml']
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4
      - run: python -m unittest discover -s tests -p test_template_window_study.py -v
