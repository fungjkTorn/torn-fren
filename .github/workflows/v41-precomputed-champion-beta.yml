name: V41 precomputed champion beta isolation
on:
  push:
    branches: [release/v41-precomputed-champion-beta-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_v41_champion_cache.py' -v
      - run: python -m py_compile web/app.py web/v41_champion_cache.py
      - run: node --test tests/test_v41_champion_graph.test.cjs
