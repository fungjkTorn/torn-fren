jobs:
  forward-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing and research dependencies
        run: python -m pip install -r requirements.txt -r research/plushie_champions/requirements-research.txt
      - name: Verify Japan V84 live inference safety tests
        run: python -m unittest discover -s tests -p 'test_v84_japan_forward_canary.py' -v
      - name: Verify Japan V86 report count and proxy accuracy safety
        run: python -m unittest discover -s tests -p 'test_v86_japan_forward_report.py' -v
      - name: Verify the three-item website preview adapter remains read-only and non-actionable
        run: python -m unittest discover -s tests -p 'test_v87_experimental24_overlay.py' -v
      - name: Verify V88 collector-heartbeat forward scoring regression
        run: python -m unittest discover -s tests -p 'test_v88_poll_state_forward_report.py' -v
      - name: Verify V89 pending classification and recommendation stability audit
        run: python -m unittest discover -s tests -p 'test_v89_pending_horizon_diagnostic.py' -v
      - name: Verify V91 item-aware decision policy contract
        run: python -m unittest discover -s tests -p 'test_v91_travel_decision_contract.py' -v
      - name: Stress test V92 11k-option research selection
        run: python -m unittest discover -s tests -p 'test_v92_stress_decision_engine.py' -v
      - name: Verify V93 rate-limited country-fresh arrival observation design
        run: python -m unittest discover -s tests -p 'test_v93_arrival_observation_policy.py' -v
      - name: Benchmark V96 1000 indexed SQLite forward arrival replays
        run: python -m unittest discover -s tests -p 'test_v96_sqlite_forward_replay_benchmark.py' -v
      - name: Verify V97 screenshot-status and provisional travel labels
        run: python -m unittest discover -s tests -p 'test_v97_experimental_dashboard_state.py' -v
      - name: Verify V98 complete forward issue cohort, ready/watches kept separate
        run: python -m unittest discover -s tests -p 'test_v98_ready_vs_watch_forward_audit.py' -v
      - name: Verify V99 pre-issuance stocked-vs-forecast causality
        run: python -m unittest discover -s tests -p 'test_v99_issued_stock_vs_forecast_audit.py' -v
      - name: Verify V100 no-lookahead long-watch reconfirmation audit
        run: python -m unittest discover -s tests -p 'test_v100_future_watch_reconfirmation_audit.py' -v
      - name: Verify V101 historical watch-to-executable conversion and no lookahead
        run: python -m unittest discover -s tests -p 'test_v101_watch_to_actionable_audit.py' -v
      - name: Verify V102 restock-window departure and existing model score-curve bridge
        run: python -m unittest discover -s tests -p 'test_v102_restock_departure_bridge.py' -v
      - name: V103 actual champion model score-curve parity and earliest candidate selection
        run: python -m unittest discover -s tests -p 'test_v103_champion_score_curves.py' -v
      - name: V104 no-lookahead earliest vs champion historical query comparators
        run: python -m unittest discover -s tests -p 'test_v104_real_champion_earliest_replay.py' -v
      - name: V105 real champion dynamic 5m replanning, shared score curve and parity
        run: python -m unittest discover -s tests -p 'test_v105_dynamic_champion_earliest_replay.py' -v
      - name: V106 verify dynamic champion parity and score-preserving earliest departure budgets
        run: python -m unittest discover -s tests -p 'test_v106_risk_budget_earliest_replay.py' -v
      - name: V107 causal restock and depletion event timing and flight-window tests
        run: python -m unittest discover -s tests -p 'test_v107_explicit_restock_cycle_baseline.py' -v
      - name: V108 explicit restock cycle dynamic flight-time calculation and safe withdrawals
        run: python -m unittest discover -s tests -p 'test_v108_explicit_cycle_dynamic_replay.py' -v
      - name: V109 validate raw event-level no-lookahead restock and depletion forecast errors
        run: python -m unittest discover -s tests -p 'test_v109_raw_restock_transition_event_audit.py' -v
      - name: V110 validate distinct 1-4 restock events, collector censorship and 106-minute flight target
        run: python -m unittest discover -s tests -p 'test_v110_multicycle_restock_horizon_audit.py' -v
      - name: V111 separate strict bracketed arrival proxy from stale and source-switched observations
        run: python -m unittest discover -s tests -p 'test_v111_arrival_proxy_evidence_audit.py' -v
      - name: V112 same-anchor model-vs-immediate paired evidence and uncertain arrival bounds
        run: python -m unittest discover -s tests -p 'test_v112_matched_immediate_vs_restock_flight_audit.py' -v
