name: V85 Japan isolated forward research
on:
  push:
    branches: [research/v38-full-roster-live-prep-20261009]
    paths:
      - '.github/workflows/v85-japan-forward.yml'
      - 'research/v84_japan_forward_canary.py'
      - 'research/v86_japan_forward_report.py'
      - 'tests/test_v84_japan_forward_canary.py'
      - 'tests/test_v86_japan_forward_report.py'
      - 'research/v87_experimental24_overlay.py'
      - 'tests/test_v87_experimental24_overlay.py'
      - 'research/v88_poll_state_forward_report.py'
      - 'tests/test_v88_poll_state_forward_report.py'
      - 'research/v89_pending_horizon_diagnostic.py'
      - 'tests/test_v89_pending_horizon_diagnostic.py'
      - 'research/v91_travel_decision_contract.py'
      - 'tests/test_v91_travel_decision_contract.py'
      - 'tests/test_v92_stress_decision_engine.py'
      - 'research/v93_arrival_observation_policy.py'
      - 'tests/test_v93_arrival_observation_policy.py'
      - 'tests/test_v96_sqlite_forward_replay_benchmark.py'
      - 'research/v97_experimental_dashboard_state.py'
      - 'tests/test_v97_experimental_dashboard_state.py'
      - 'research/v98_ready_vs_watch_forward_audit.py'
      - 'tests/test_v98_ready_vs_watch_forward_audit.py'
      - 'research/v99_issued_stock_vs_forecast_audit.py'
      - 'tests/test_v99_issued_stock_vs_forecast_audit.py'
      - 'research/v100_future_watch_reconfirmation_audit.py'
      - 'tests/test_v100_future_watch_reconfirmation_audit.py'
      - 'research/v101_watch_to_actionable_audit.py'
      - 'tests/test_v101_watch_to_actionable_audit.py'
      - 'deploy/scripts/v87_web24_preview.sh'
      - 'deploy/scripts/v85_japan_forward_timer.sh'
      - 'deploy/systemd/torn-fren-v85-japan-forward.service'
      - 'deploy/systemd/torn-fren-v85-japan-forward.timer'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing and research dependencies
        run: python -m pip install -r requirements.txt -r research/plushie_champions/requirements-research.txt
      - name: Verify Japan V84 live inference safety tests
        run: python -m unittest discover -s tests -p 'test_v84_japan_forward_canary.py' -v
      - name: Verify Japan V86 report count and proxy accuracy safety
        run: python -m unittest discover -s tests -p 'test_v86_japan_forward_report.py' -v
      - name: Verify the three-item website preview adapter remains read-only and non-actionable
        run: python -m unittest discover -s tests -p 'test_v87_experimental24_overlay.py' -v
      - name: Verify V88 collector-heartbeat forward scoring regression
        run: python -m unittest discover -s tests -p 'test_v88_poll_state_forward_report.py' -v
      - name: Verify V89 pending classification and recommendation stability audit
        run: python -m unittest discover -s tests -p 'test_v89_pending_horizon_diagnostic.py' -v
      - name: Verify V91 item-aware decision policy contract
        run: python -m unittest discover -s tests -p 'test_v91_travel_decision_contract.py' -v
      - name: Stress test V92 11k-option research selection
        run: python -m unittest discover -s tests -p 'test_v92_stress_decision_engine.py' -v
      - name: Verify V93 rate-limited country-fresh arrival observation design
        run: python -m unittest discover -s tests -p 'test_v93_arrival_observation_policy.py' -v
      - name: Benchmark V96 1000 indexed SQLite forward arrival replays
        run: python -m unittest discover -s tests -p 'test_v96_sqlite_forward_replay_benchmark.py' -v
      - name: Verify V97 screenshot-status and provisional travel labels
        run: python -m unittest discover -s tests -p 'test_v97_experimental_dashboard_state.py' -v
      - name: Verify V98 complete forward issue cohort, ready/watches kept separate
        run: python -m unittest discover -s tests -p 'test_v98_ready_vs_watch_forward_audit.py' -v
      - name: Verify V99 pre-issuance stocked-vs-forecast causality
        run: python -m unittest discover -s tests -p 'test_v99_issued_stock_vs_forecast_audit.py' -v
      - name: Verify V100 no-lookahead long-watch reconfirmation audit
        run: python -m unittest discover -s tests -p 'test_v100_future_watch_reconfirmation_audit.py' -v
      - name: Verify V101 historical watch-to-executable conversion and no lookahead
        run: python -m unittest discover -s tests -p 'test_v101_watch_to_actionable_audit.py' -v
      - name: Verify Japan implementation compiles
        run: python -m py_compile research/v84_japan_forward_canary.py research/v86_japan_forward_report.py research/v87_experimental24_overlay.py research/v88_poll_state_forward_report.py research/v89_pending_horizon_diagnostic.py research/v91_travel_decision_contract.py research/v93_arrival_observation_policy.py research/v97_experimental_dashboard_state.py research/v98_ready_vs_watch_forward_audit.py research/v99_issued_stock_vs_forecast_audit.py research/v100_future_watch_reconfirmation_audit.py research/v101_watch_to_actionable_audit.py
      - name: Validate guarded opt-in service installer syntax
        run: bash -n deploy/scripts/v85_japan_forward_timer.sh deploy/scripts/v87_web24_preview.sh
