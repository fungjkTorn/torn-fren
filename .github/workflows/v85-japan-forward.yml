        run: python -m unittest discover -s tests -p 'test_v143_v2_window_web_parity.py' -v
      - name: Verify dual-view offline, expiry and baseline isolation regressions
        run: python -m unittest discover -s tests -p 'test_beta_departure_freshness.py' -v
