permissions:
  contents: read

jobs:
  forward-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing and research dependencies
        run: python -m pip install -r requirements.txt -r research/plushie_champions/requirements-research.txt
      - name: Verify Japan V84 live inference safety tests
        run: python -m unittest discover -s tests -p 'test_v84_japan_forward_canary.py' -v
      - name: Verify Japan V86 report count and proxy accuracy safety
        run: python -m unittest discover -s tests -p 'test_v86_japan_forward_report.py' -v
      - name: Verify the three-item website preview adapter remains read-only and non-actionable
        run: python -m unittest discover -s tests -p 'test_v87_experimental24_overlay.py' -v
      - name: Verify V88 collector-heartbeat forward scoring regression
        run: python -m unittest discover -s tests -p 'test_v88_poll_state_forward_report.py' -v
      - name: Verify V89 pending classification and recommendation stability audit
        run: python -m unittest discover -s tests -p 'test_v89_pending_horizon_diagnostic.py' -v
      - name: Verify V91 item-aware decision policy contract
        run: python -m unittest discover -s tests -p 'test_v91_travel_decision_contract.py' -v
      - name: Stress test V92 11k-option research selection
        run: python -m unittest discover -s tests -p 'test_v92_stress_decision_engine.py' -v
      - name: Verify V93 rate-limited country-fresh arrival observation design
        run: python -m unittest discover -s tests -p 'test_v93_arrival_observation_policy.py' -v
      - name: Benchmark V96 1000 indexed SQLite forward arrival replays
        run: python -m unittest discover -s tests -p 'test_v96_sqlite_forward_replay_benchmark.py' -v
      - name: Verify V97 screenshot-status and provisional travel labels
        run: python -m unittest discover -s tests -p 'test_v97_experimental_dashboard_state.py' -v
      - name: Verify V98 complete forward issue cohort, ready/watches kept separate
        run: python -m unittest discover -s tests -p 'test_v98_ready_vs_watch_forward_audit.py' -v
      - name: Verify V99 pre-issuance stocked-vs-forecast causality
        run: python -m unittest discover -s tests -p 'test_v99_issued_stock_vs_forecast_audit.py' -v
      - name: Verify V100 no-lookahead long-watch reconfirmation audit
        run: python -m unittest discover -s tests -p 'test_v100_future_watch_reconfirmation_audit.py' -v
      - name: Verify V101 historical watch-to-executable conversion and no lookahead
        run: python -m unittest discover -s tests -p 'test_v101_watch_to_actionable_audit.py' -v
      - name: Verify V102 restock-window departure and existing model score-curve bridge
        run: python -m unittest discover -s tests -p 'test_v102_restock_departure_bridge.py' -v
      - name: V103 actual champion model score-curve parity and earliest candidate selection
        run: python -m unittest discover -s tests -p 'test_v103_champion_score_curves.py' -v
      - name: V104 no-lookahead earliest vs champion historical query comparators
        run: python -m unittest discover -s tests -p 'test_v104_real_champion_earliest_replay.py' -v
      - name: V105 real champion dynamic 5m replanning, shared score curve and parity
        run: python -m unittest discover -s tests -p 'test_v105_dynamic_champion_earliest_replay.py' -v
      - name: V106 verify dynamic champion parity and score-preserving earliest departure budgets
        run: python -m unittest discover -s tests -p 'test_v106_risk_budget_earliest_replay.py' -v
      - name: V107 causal restock and depletion event timing and flight-window tests
        run: python -m unittest discover -s tests -p 'test_v107_explicit_restock_cycle_baseline.py' -v
      - name: V108 explicit restock cycle dynamic flight-time calculation and safe withdrawals
        run: python -m unittest discover -s tests -p 'test_v108_explicit_cycle_dynamic_replay.py' -v
      - name: V109 validate raw event-level no-lookahead restock and depletion forecast errors
        run: python -m unittest discover -s tests -p 'test_v109_raw_restock_transition_event_audit.py' -v
      - name: V110 validate distinct 1-4 restock events, collector censorship and 106-minute flight target
        run: python -m unittest discover -s tests -p 'test_v110_multicycle_restock_horizon_audit.py' -v
      - name: V111 separate strict bracketed arrival proxy from stale and source-switched observations
        run: python -m unittest discover -s tests -p 'test_v111_arrival_proxy_evidence_audit.py' -v
      - name: V112 same-anchor model-vs-immediate paired evidence and uncertain arrival bounds
        run: python -m unittest discover -s tests -p 'test_v112_matched_immediate_vs_restock_flight_audit.py' -v
      - name: V113 verify predeclared event offset decision points against identical immediate-flight baseline
        run: python -m unittest discover -s tests -p 'test_v113_phase_offset_departure_comparison.py' -v
      - name: V114 poll-heartbeat reconstructed stock arrival parity against V113 immediate baseline
        run: python -m unittest discover -s tests -p 'test_v114_matched_poll_heartbeat_flight_audit.py' -v
      - name: V115 bounded SQL item pushdown without raising V88 all-roster safety limit
        run: python -m unittest discover -s tests -p 'test_v115_targeted_v88_forward_evidence.py' -v
      - name: V116 attributable first-issued hourly item snapshots and matched counterfactual validation
        run: python -m unittest discover -s tests -p 'test_v116_attributed_hourly_forward_audit.py' -v
      - name: V117 simulated V75 five-minute replans resolve to first executable issue, censor unconverted watches
        run: python -m unittest discover -s tests -p 'test_v117_first_executable_replan_audit.py' -v
      - name: V118 diagnose rolling departure watches vs fixed convergence and missing research ticks
        run: python -m unittest discover -s tests -p 'test_v118_watch_convergence_diagnostic.py' -v
      - name: V119 frozen asof same-cohort triple confirmation vs fresh and immediate replay
        run: python -m unittest discover -s tests -p 'test_v119_stable_commitment_vs_fresh_replay.py' -v
      - name: V120 confirm frozen stable candidate persists to departure using as-issued ticks
        run: python -m unittest discover -s tests -p 'test_v120_commitment_departure_reconfirmation.py' -v
      - name: V121 early high-score Nessie replay with asof maturity, V88 outcome proxy and unchanged original selector
        run: python -m unittest discover -s tests -p 'test_v121_nessie_native_vs_earliest_forward_proxy.py' -v
      - name: V122 diagnose binary template score and zero lift over immediate arrival on frozen V121 cohort
        run: python -m unittest discover -s tests -p 'test_v122_nessie_selector_discrimination_audit.py' -v
      - name: V123 empirical multi-cycle survival from depletion - no-lookahead and matched stock proxy
        run: python -m unittest discover -s tests -p 'test_v123_empirical_phase_survival_challenger.py' -v
      - name: V124 verify opt-in prospective one-shot shadow defaults to no-write, only private event-idempotent sidecar
        run: python -m unittest discover -s tests -p 'test_v124_prospective_survival_shadow.py' -v
      - name: V125 two-phase earliest-arrival confidence and isolated issued-five-minute shadow capture
        run: python -m unittest discover -s tests -p 'test_v125_earliest_credible_shadow.py' -v
      - name: V126 source-phase onset uncertainty remains provisional and defaults no-write
        run: python -m unittest discover -s tests -p 'test_v126_unknown_onset_sensitivity.py' -v
      - name: V127 ensure isolated opt-in five-minute recorder stays disabled on preview
        run: python -m unittest discover -s tests -p 'test_v127_optional_shadow_timer.py' -v
      - name: V128 exact 24 roster source-pinned empirical UK parity and isolated sidecar verification
        run: python -m unittest discover -s tests -p 'test_v128_full24_earliest_shadow.py' -v
      - name: Verify Japan implementation compiles
        run: python -m py_compile research/v84_japan_forward_canary.py research/v86_japan_forward_report.py research/v87_experimental24_overlay.py research/v88_poll_state_forward_report.py research/v89_pending_horizon_diagnostic.py research/v91_travel_decision_contract.py research/v93_arrival_observation_policy.py research/v97_experimental_dashboard_state.py research/v98_ready_vs_watch_forward_audit.py research/v99_issued_stock_vs_forecast_audit.py research/v100_future_watch_reconfirmation_audit.py research/v101_watch_to_actionable_audit.py research/v102_restock_departure_bridge.py research/v103_champion_score_curves.py research/v104_real_champion_earliest_replay.py research/v105_dynamic_champion_earliest_replay.py research/v106_risk_budget_earliest_replay.py research/v107_explicit_restock_cycle_baseline.py research/v108_explicit_cycle_dynamic_replay.py research/v109_raw_restock_transition_event_audit.py research/v110_multicycle_restock_horizon_audit.py research/v111_arrival_proxy_evidence_audit.py research/v112_matched_immediate_vs_restock_flight_audit.py research/v113_phase_offset_departure_comparison.py research/v114_matched_poll_heartbeat_flight_audit.py research/v115_targeted_v88_forward_evidence.py research/v116_attributed_hourly_forward_audit.py research/v117_first_executable_replan_audit.py research/v118_watch_convergence_diagnostic.py research/v119_stable_commitment_vs_fresh_replay.py research/v120_commitment_departure_reconfirmation.py research/v121_nessie_native_vs_earliest_forward_proxy.py research/v122_nessie_selector_discrimination_audit.py research/v123_empirical_phase_survival_challenger.py research/v124_prospective_survival_shadow.py research/v125_earliest_credible_shadow.py research/v126_unknown_onset_sensitivity.py research/v128_full24_earliest_shadow.py
      - name: Validate guarded opt-in service installer syntax
        run: bash -n deploy/scripts/v85_japan_forward_timer.sh deploy/scripts/v87_web24_preview.sh
