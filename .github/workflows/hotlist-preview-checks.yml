name: Hot List browser and pricing checks

on:
  pull_request:
    paths:
      - 'web/first_release_assets/hotlist*'
      - 'tests/hotlist-core.test.cjs'
      - 'tests/test_hotlist_browser.py'
      - 'tests/test_hotlist_deploy_patch.py'
      - 'web/first_release_bridge.py'
      - 'web/beanstalk_hot_list.py'
      - 'tests/test_beanstalk_hot_list.py'
      - 'tests/test_publish_beanstalk_hot_list.py'
      - 'deploy/scripts/publish_beanstalk_hot_list.py'
      - 'deploy/Publish-BeanstalkHotList.ps1'
      - 'web/first_release_assets/abroad-roster.json'
      - 'deploy/scripts/relocate_hotlist.py'
      - 'deploy/scripts/publish_hotlist_profitability.py'
      - 'tests/test_hotlist_nikeh_deploy.py'
      - 'deploy/Publish-HotList.ps1'
      - 'docs/HOT_LIST_REVIEW.md'
      - 'tests/test_first_release_live.py'
      - '.github/workflows/hotlist-preview-checks.yml'
  push:
    branches: [main]
    paths:
      - 'web/first_release_assets/hotlist*'
      - 'tests/hotlist-core.test.cjs'
      - 'tests/test_hotlist_browser.py'
      - 'tests/test_hotlist_deploy_patch.py'
      - 'web/first_release_bridge.py'
      - 'web/beanstalk_hot_list.py'
      - 'tests/test_beanstalk_hot_list.py'
      - 'tests/test_publish_beanstalk_hot_list.py'
      - 'deploy/scripts/publish_beanstalk_hot_list.py'
      - 'deploy/Publish-BeanstalkHotList.ps1'
      - 'web/first_release_assets/abroad-roster.json'
      - 'deploy/scripts/relocate_hotlist.py'
      - 'deploy/scripts/publish_hotlist_profitability.py'
      - 'tests/test_hotlist_nikeh_deploy.py'
      - 'deploy/Publish-HotList.ps1'
      - 'docs/HOT_LIST_REVIEW.md'
      - '.github/workflows/hotlist-preview-checks.yml'

permissions:
  contents: read

jobs:
  windows-publisher:
    name: Windows PowerShell deploy script checks
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Parse and reject assignments to read-only HOME variable
        shell: pwsh
        run: |
          $path = 'deploy/Publish-HotList.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell syntax errors: $($errors -join '; ')" }
          $assignments = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.AssignmentStatementAst]
          }, $true)
          foreach ($assignment in $assignments) {
            if ($assignment.Left -is [System.Management.Automation.Language.VariableExpressionAst]) {
              if ($assignment.Left.VariablePath.UserPath -ieq 'HOME') {
                throw "Reserved read-only PowerShell variable HOME is assigned in line $($assignment.Extent.StartLineNumber)"
              }
            }
          }
          Write-Host 'PASS: valid PowerShell syntax and no writes to reserved HOME'

      - name: Parse Beanstalk seven-pick API deployment PowerShell
        shell: pwsh
        run: |
          $file = 'deploy/Publish-BeanstalkHotList.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell syntax errors: $($errors -join '; ')" }
          $assign = $ast.FindAll({
            param($n)
            $n -is [System.Management.Automation.Language.AssignmentStatementAst]
          }, $true)
          foreach ($item in $assign) {
            if ($item.Left -is [System.Management.Automation.Language.VariableExpressionAst]) {
              if ($item.Left.VariablePath.UserPath -ieq 'HOME') {
                throw 'Cannot assign to reserved HOME variable'
              }
            }
          }
          Write-Host 'PASS: valid Beanstalk API PowerShell syntax and no HOME collisions'
  browser:
    name: Hot List Chromium smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax and numeric profitability contracts
        run: |
          node --check web/first_release_assets/hotlist-core.js
          node --check web/first_release_assets/hotlist.js
          node tests/hotlist-core.test.cjs
      - name: Compile and validate guarded deployment patch
        run: |
          python -m pip install --disable-pip-version-check fastapi httpx
          python -m py_compile deploy/scripts/relocate_hotlist.py
          python tests/test_hotlist_deploy_patch.py
          python -m py_compile deploy/scripts/publish_hotlist_profitability.py
          python tests/test_hotlist_nikeh_deploy.py
          python -m py_compile web/beanstalk_hot_list.py
          python -m py_compile deploy/scripts/publish_beanstalk_hot_list.py
          PYTHONPATH=. python tests/test_publish_beanstalk_hot_list.py
          PYTHONPATH=. python tests/test_beanstalk_hot_list.py
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test actual rendered homepage at desktop and mobile sizes
        run: python tests/test_hotlist_browser.py
      - name: Save desktop review screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotlist-desktop-screenshot
          path: desktop-test.png
          if-no-files-found: ignore
          retention-days: 14
