name: V33 private shadow evidence sampler

on:
  push:
    branches:
      - release/vm-shadow-evidence-v33-20261008
  pull_request:
    paths:
      - 'research/v31_shadow_evidence_capture.py'
      - 'research/v33_private_shadow_sampler.py'
      - 'tests/test_v31_shadow_evidence_capture.py'
      - 'tests/test_v33_private_shadow_sampler.py'
      - 'tests/test_v33_systemd_units.py'
      - 'deploy/systemd/torn-fren-shadow-capture.service'
      - 'deploy/systemd/torn-fren-shadow-capture.timer'
      - '.github/workflows/v33-shadow-evidence.yml'

permissions:
  contents: read

jobs:
  canary-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_v31_shadow_evidence_capture.py' -v
      - run: python -m unittest discover -s tests -p 'test_v33_private_shadow_sampler.py' -v
      - run: python -m unittest discover -s tests -p 'test_v33_systemd_units.py' -v
      - run: systemd-analyze calendar '*-*-* *:01/5:00'
      - run: python -m py_compile research/v31_shadow_evidence_capture.py research/v33_private_shadow_sampler.py
