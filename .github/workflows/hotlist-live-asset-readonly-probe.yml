name: Read-only Hot List live asset fingerprint
on:
  push:
    branches:
      - diagnostic/hotlist-live-asset-hashes-20261113
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Compare publicly served assets to repository bytes and precise CRLF conversion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, subprocess
          from pathlib import Path
          root="https://tornfren.duckdns.org"
          for name in ("hotlist.css","hotlist-core.js","hotlist.js","hotlist.html"):
            local=Path("web/first_release_assets")/name
            baseline=(subprocess.check_output(["git","show",
              "e4ddb3e5851e0080dd65261012d469da85f83879:web/first_release_assets/"+name])
              if name in ("hotlist.html","hotlist.js") else local.read_bytes())
            # Only CSS/core/JS have a first-release-assets route.
            url=root+("/" if name=="hotlist.html" else "/first-release-assets/"+name)
            print("ASSET "+name+" BASE_BYTES "+str(len(baseline))+" BASE_NEWLINES "+str(baseline.count(bytes([10]))),flush=True)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Torn-FREN-ReadOnly-Public-Asset-Probe/2"})
              with urllib.request.urlopen(req,timeout=12) as response:
                live=response.read(1024*1024+1)
              converted=baseline.replace(bytes([10]),bytes([13,10]))
              normalized=live.replace(bytes([13,10]),bytes([10]))
              print("ASSET "+name+" LIVE_BYTES "+str(len(live))+
                    " EQUAL_RAW "+str(live==baseline)+" EQUAL_CRLF_CONVERSION "+str(live==converted)+
                    " EQUAL_AFTER_NORMALIZE "+str(normalized==baseline)+
                    " ALLOWED_NORMALIZATION "+str((bytes([13]) not in normalized) and normalized==baseline),flush=True)
            except Exception as e:
              print("ASSET "+name+" REQUEST_ERROR "+type(e).__name__+": "+str(e),flush=True)
          PY
