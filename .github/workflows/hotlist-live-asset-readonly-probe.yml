name: Read-only Hot List live asset fingerprint
on:
  push:
    branches:
      - diagnostic/hotlist-live-asset-hashes-20261113
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fingerprint publicly served CSS and JS only (no server changes)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request
          root="https://tornfren.duckdns.org"
          expected={
            "hotlist.css":"d06b9cd60ea5881f380a5127676c73f2f46a1264",
            "hotlist-core.js":"629658ffa1a66eccf1e9f2ac3dd6f316dc3edbfa",
            "hotlist.js":"20bd140f63e06609f02776b6e92b73dab701a9af",
          }
          for name,ref in expected.items():
            url=root+"/first-release-assets/"+name
            print("ASSET "+name+" EXPECTED_V1_GIT_BLOB_SHA "+ref,flush=True)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Torn-FREN-ReadOnly-Public-Asset-Probe/1"}),timeout=12) as response:
                raw=response.read(1024*1024+1)
                if len(raw)>1024*1024:raise ValueError("oversized asset")
                sha=hashlib.sha1(("blob "+str(len(raw))).encode()+bytes([0])+raw).hexdigest()
                print("ASSET "+name+" STATUS "+str(response.status)+" BYTES "+str(len(raw))+" PUBLIC_GIT_BLOB_SHA "+sha+" MATCH_V1 "+str(sha==ref),flush=True)
            except Exception as exc:
              print("ASSET "+name+" FETCH_FAILED "+type(exc).__name__+": "+str(exc),flush=True)
          PY
