name: V36 isolated rotating museum-Japan pilot

on:
  push:
    branches: [release/v36-isolated-rotating-museum-pilot-20261008]
  pull_request:
    paths:
      - 'research/v36_isolated_museum_sampler.py'
      - 'research/v34_prospective_ops_audit.py'
      - 'deploy/systemd/torn-fren-shadow-capture.service'
      - 'tests/test_v36_isolated_museum_sampler.py'
      - 'tests/test_v33_systemd_units.py'
      - '.github/workflows/v36-isolated-museum.yml'

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -p 'test_v36_isolated_museum_sampler.py' -v
      - run: python -m unittest discover -s tests -p 'test_v35_museum_japan_private_pilot.py' -v
      - run: python -m unittest discover -s tests -p 'test_v33_systemd_units.py' -v
      - run: python -m unittest discover -s tests -p 'test_v33_private_shadow_sampler.py' -v
      - run: python -m unittest discover -s tests -p 'test_v34_prospective_ops_audit.py' -v
      - run: python -m py_compile research/v36_isolated_museum_sampler.py research/v34_prospective_ops_audit.py
      - run: systemd-analyze calendar '*-*-* *:01/5:00'
