name: Departure publication-delay diagnostic
on:
  push:
    branches: [research/v38-full-roster-live-prep-20261009]
    paths:
      - 'research/departure_latency_audit.py'
      - 'tests/test_departure_latency_audit.py'
      - '.github/workflows/departure-latency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p test_departure_latency_audit.py -v
